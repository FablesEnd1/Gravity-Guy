<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gravity Guy</title>
<style>
  *{box-sizing:border-box}
  html,body,#player{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000}
  #player{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
  ruffle-player{display:block;width:100%!important;height:100%!important}
  #status{position:fixed;left:12px;bottom:12px;z-index:10;color:#fff;background:#222;padding:8px 10px;font:14px system-ui,sans-serif;border-radius:6px;max-width:calc(100vw - 24px)}
  #status:empty{display:none}
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    ...(window.RufflePlayer.config || {}),
    autoplay: "on",
    unmuteOverlay: "hidden",
    // Keep normal Flash networking enabled; only deny opening another website.
    allowNetworking: "all",
    openUrlMode: "deny",
    allowScriptAccess: false,
    splashScreen: false,
    contextMenu: "off",
    letterbox: "fullscreen",
    scale: "showAll"
  };
</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<div id="player"></div><div id="status">Loading Gravity Guy…</div>
<script>
(async()=>{
  const box=document.getElementById('player');
  const status=document.getElementById('status');
  const swfUrl='https://raw.githubusercontent.com/FablesEnd1/Gravity-Guy/main/gravity-guy-patched.swf';
  try {
    if(!window.RufflePlayer) throw new Error('Ruffle did not load. Check your internet connection or CDN access.');
    const ruffle=window.RufflePlayer.newest();
    const player=ruffle.createPlayer();
    player.style.width='100%'; player.style.height='100%';
    box.appendChild(player);
    player.addEventListener('loadeddata',()=>{status.textContent='';});
    await player.load({url:swfUrl, autoplay:'on'});
    status.textContent='';
  } catch(err) {
    status.textContent='Could not load the game. Check that gravity-guy-patched.swf exists on the GitHub main branch. Details: '+(err?.message||String(err));
    console.error('Gravity Guy load failed:',err);
  }
  box.addEventListener('dblclick',async()=>{if(!document.fullscreenElement&&box.requestFullscreen){try{await box.requestFullscreen()}catch(e){console.error(e)}}});
})();
</script>
</body>
</html>
